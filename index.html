<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Star Program</title>
  <!-- Add Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&display=swap" rel="stylesheet">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    } 

    body {
      background: url('https://images.pexels.com/photos/7717505/pexels-photo-7717505.jpeg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Rakkas', serif;
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 5.5rem;
      letter-spacing: 2px;
      margin-bottom: -.4em;

    }

    h2 {
      font-size: 2.8rem;
      letter-spacing: 1px;
      margin-bottom: 0=-.4em;
    }


    p {
      font-size: 1.8rem;
      color: white;
      margin: 1em auto;
      max-width: 500px;
      line-height: 1.5em;
     
    }

    .crystal-ball {
      margin: 1.5em 0;
    }

    .custom-link {display: inline-block;
      padding: 7px 15px;
      background-color: #00A451;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      border-radius: 35px;
      transition: background-color 0.2s ease;
    }
 .custom-link:hover {
      background-color: #000000;
 }
    .reveal-btn {
      background: #006633;
      color: white;
      padding: 12px 36px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .reveal-btn:hover {
      background: #00994d;
    }

    #result {
      margin-top: 30px;
    }

    #result img {
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <h1>THE STAR</h1><h2>PROGRAM</h2><h1>ORACLE</h1>

  <p>Explore the symbols left by a well-filled cup.
  The leaves do not predict, they reveal.</p>

  <button class="reveal-btn" onclick="showRandomImage()">Examine your cup</button>

  <div id="result"></div>

  <script>
    function showRandomImage() {
      const images = [
        "https://i.imgur.com/oRPN0ah.jpeg",
        "https://i.imgur.com/9l2SqX2.jpeg",
        "https://i.imgur.com/Ip6YW0R.jpeg",
        "https://i.imgur.com/KGLyD5L.jpeg",
        "https://i.imgur.com/u7cwDH3.jpeg"
      ];
      const randomImg = images[Math.floor(Math.random() * images.length)];
      document.getElementById("result").innerHTML = 
        `<img src="${randomImg}" alt="Your aura">`;
    }
  </script>
  <br>
   <a href="https://ulnfp.sharepoint.com.mcas.ms/sites/GRPNAStandardsDivision/SitePages/StakeholderAwardsProgram.aspx" class="custom-link" target="_blank">Visit STAR Awards Page</a
<br>
</body>
</html>
