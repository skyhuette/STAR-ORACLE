<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Star Program</title>
  <!-- Add Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rakkas&display=swap" rel="stylesheet">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    } 

    body {
      background: url('https://images.pexels.com/photos/7717505/pexels-photo-7717505.jpeg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Rakkas', serif;
      color: #A89057;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 5.2rem;
      letter-spacing: 2px;
      margin-bottom: -.3em;

    }

    h2 {
      font-size: 2.6rem;
      letter-spacing: 1px;
    
    }
    
    h1, h2 {
  margin: 0;
  padding: 0;
  line-height: .85;
}


    p {
      font-size: 1.8rem;
      color: #F2F0E2;
      margin: .5em auto;
      max-width: 500px;
      line-height: 1.5em;
     
    }
    
     p1 {
      font-size: 1.3rem;
      color: white;
      margin: .5em auto;
      max-width: 500px;
      line-height: 1.3em;
     
    }

.teacup-image {
  width: 260px;
  max-width: 80vw;
  margin: 2px 0;
  display: block;
}
    .custom-link {display: inline-block;
      padding: 7px 15px;
      background-color: #123a28;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      border-radius: 35px;
      transition: background-color 0.2s ease;
    }
 .custom-link:hover {
      background-color: #000000;
 }
    .reveal-btn {
      background: #A89057;
      color: white;
      padding: 12px 36px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .reveal-btn:hover {
      background: #000000;
    }
   

    #result {
      margin-top: 30px;
    }

    #result img {
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
    }
    
   
  </style>
</head>
<body>
  <h1>THE STAR</h1><h2>PROGRAM</h2><h1>ORACLE</h1>

<p>A message, a sign, a considersation to take, waits at the bottom of your teacup.</p>

<img id="teacup-image"
     src="https://i.imgur.com/cWAjQag.png"
     alt="Tea Cup"
     class="teacup-image">


<button

  <button class="reveal-btn" onclick="showRandomImage()">Examine the leaves</button>

  <div id="result"></div>

  <script>
    function showRandomImage() {
    document.getElementById("teacup-image").style.display = "none";
      const images = [
        "https://i.imgur.com/oRPN0ah.jpeg",
        "https://i.imgur.com/9l2SqX2.jpeg",
        "https://i.imgur.com/Ip6YW0R.jpeg",
        "https://i.imgur.com/KGLyD5L.jpeg",
        "https://i.imgur.com/4PUd5lu.png",
        "https://i.imgur.com/gN1YzJe.png",
        "https://i.imgur.com/LH8svo2.png",
        "https://i.imgur.com/u7cwDH3.jpeg"
      ];
      const randomImg = images[Math.floor(Math.random() * images.length)];
      document.getElementById("result").innerHTML = 
        `<img src="${randomImg}" alt="Your aura">`;
    }
    
    
  </script>
  <br>
   <a href="https://ulnfp.sharepoint.com.mcas.ms/sites/GRPNAStandardsDivision/SitePages/StakeholderAwardsProgram.aspx" class="custom-link" target="_blank">Visit STAR Awards Page</a

</body>
</html>
